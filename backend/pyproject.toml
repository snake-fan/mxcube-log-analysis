[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mxcube-log-analysis-backend"
version = "0.1.0"
description = "FastAPI and LangGraph backend for MXCuBE fault diagnosis."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "asyncpg>=0.29.0",
  "fastapi>=0.115.0,<1.0.0",
  "langgraph>=0.2.0",
  "pgvector>=0.3.0",
  "pydantic-settings>=2.4.0",
  "sqlalchemy[asyncio]>=2.0.0",
  "uvicorn[standard]>=0.30.0",
]

[dependency-groups]
dev = [
  "httpx>=0.27.0",
  "pytest>=8.0.0",
  "ruff>=0.6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
